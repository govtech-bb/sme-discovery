|'';var h=opts.hint?'<p class="text-[1.1rem] text-bb-mid-grey-00 mt-xs mb-xs">'+_e(opts.hint)+'</p>':'';return'<div class="fg flex flex-col gap-xs w-full items-start"><label for="'+id+'" class="block text-[1.25rem] font-bold">'+_e(lbl)+'</label>'+h+'<div class="iw '+G.IW+' flex-col p-0"><textarea id="'+id+'" data-field="'+id+'" rows="'+(opts.rows||4)+'" class="w-full p-s outline-none rounded-[inherit] resize-y">'+_e(v)+'</textarea></div></div>';};G.rg=function(n,lbl,opts_list,opts){opts=opts||{};var h=opts.hint?'<p class="text-[1.1rem] text-bb-mid-grey-00 mb-xs">'+_e(opts.hint)+'</p>':'';var items='';opts_list.forEach(function(o){var v=typeof o==='object'?o.value:o;var l=typeof o==='object'?o.label:o;items+='<div class="flex gap-5 items-center"><button type="button" role="radio" aria-checked="false" data-name="'+n+'" data-value="'+_e(v)+'" class="relative inline-flex size-12 shrink-0 items-center justify-center bg-bb-white-00 border-2 border-bb-black-00 rounded-full outline-none hover:cursor-pointer hover:shadow-form-hover focus-visible:ring-4 focus-visible:ring-bb-teal-100"></button><label class="text-[1.25rem] cursor-pointer">'+_e(l)+'</label></div>';});return'<div class="fg flex flex-col gap-s items-start w-full"><p class="text-[1.25rem] font-bold">'+_e(lbl)+'</p>'+h+items+'</div>';};G.sr=function(lbl,val,chg){var cl=chg?'<a href="#" onclick="nav(\''+chg+'\');return false;" class="'+G.LNK+' text-[1rem]">Change<span class="sr-only"> '+_e(lbl)+'</span></a>':'';return'<div class="summary-row"><dt>'+_e(lbl)+'</dt><dd>'+_e(val||'—')+'</dd><div>'+cl+'</div></div>';};function _e(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}g.GovBB=G;g.next=function(){G.next();};g.back=function(){G.back();};g.nav=function(p){G.nav(p);};}(window));

<script>
/* ═══════════════════════════════════════
   SME Questionnaire v2 — Form Logic
═══════════════════════════════════════ */

const F = 'Service Discovery Questionnaire';

/* ── Service store ── */
// G.D.services = array of service objects
// G.D._editingService = index being edited (or null = new)

function getServices() {
  return GovBB.D.services || [];
}

function saveCurrentService() {
  const D = GovBB.D;
  const svc = {
    name: D['svc-name'] || '',
    description: D['svc-desc'] || '',
    section: D['svc-section'] || '',
    sectionEmail: D['svc-section-email'] || '',
    sectionTel: D['svc-section-tel'] || '',
    volume: D['svc-volume'] || '',
    submissionMethod: D['svc-submission'] || '',
    submissionOther: D['svc-submission-other'] || '',
    approver: D['svc-approver'] || '',
    processorIsSme: D['svc-processor-is-sme'] || '',
    processorName: D['svc-processor-name'] || '',
    processorRole: D['svc-processor-role'] || '',
    processorEmail: D['svc-processor-email'] || '',
    processorTel: D['svc-processor-tel'] || '',
    formLink: D['svc-form-link'] || '',
  };
  const svcs = getServices();
  const idx = D._editingService;
  if (idx !== null && idx !== undefined && idx >= 0) {
    svcs[idx] = svc;
  } else {
    svcs.push(svc);
  }
  D.services = svcs;
  D._editingService = null;
}

function loadServiceForEdit(idx) {
  const svc = getServices()[idx];
  if (!svc) return;
  GovBB.D._editingService = idx;
  GovBB.D['svc-name'] = svc.name;
  GovBB.D['svc-desc'] = svc.description;
  GovBB.D['svc-section'] = svc.section;
  GovBB.D['svc-section-email'] = svc.sectionEmail;
  GovBB.D['svc-section-tel'] = svc.sectionTel;
  GovBB.D['svc-volume'] = svc.volume;
  GovBB.D['svc-submission'] = svc.submissionMethod;
  GovBB.D['svc-submission-other'] = svc.submissionOther;
  GovBB.D['svc-approver'] = svc.approver;
  GovBB.D['svc-processor-is-sme'] = svc.processorIsSme;
  GovBB.D['svc-processor-name'] = svc.processorName;
  GovBB.D['svc-processor-role'] = svc.processorRole;
  GovBB.D['svc-processor-email'] = svc.processorEmail;
  GovBB.D['svc-processor-tel'] = svc.processorTel;
  GovBB.D['svc-form-link'] = svc.formLink;
}

function clearServiceFields() {
  ['svc-name','svc-desc','svc-section','svc-section-email','svc-section-tel',
   'svc-volume','svc-submission','svc-submission-other','svc-approver',
   'svc-processor-is-sme','svc-processor-name','svc-processor-role',
   'svc-processor-email','svc-processor-tel','svc-form-link'].forEach(k => {
    delete GovBB.D[k];
  });
  GovBB.D._editingService = null;
}

function addAnotherService() {
  saveCurrentService();
  clearServiceFields();
  // Stay on service page, re-render with fresh fields
  GovBB.render();
}

function removeService(idx) {
  const svcs = getServices();
  svcs.splice(idx, 1);
  GovBB.D.services = svcs;
  GovBB.render();
}

function editService(idx) {
  loadServiceForEdit(idx);
  nav('service-details');
}

/* ── Flow ── */
const FLOW = [
  'start',
  'about-you',
  'service-details',
  'service-summary',
  'constraints',
  'what-well-cover',
  'check',
  'confirmation'
];

/* ── Pages ── */
const PAGES = {

  'start': () => `
    <div class="space-y-8">
      <div class="inline-flex items-center gap-2 bg-bb-blue-00 text-bb-white-00 text-[0.875rem] font-bold px-3 py-1 rounded-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        For Ministry and Department staff only
      </div>
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">Service Discovery Questionnaire</h1>
      <p class="text-bb-mid-grey-00 text-[1rem]">GovTech Barbados — sent to you before your co-design session</p>
      <p>The GovTech Barbados team is coming to work with you on digitising one or more of your services. Before we arrive, we need a few details to help us prepare.</p>
      <div class="bg-bb-teal-10 border-l-4 border-bb-teal-100 p-5 space-y-2">
        <p class="font-bold">This takes about 15 to 20 minutes.</p>
        <p>We only ask for the essentials here. Everything else — the detail of each form, eligibility, who does what — we'll go through together in the session.</p>
      </div>
      <div>
        <h2 class="font-bold text-[1.5rem] mb-3">What we'll ask you</h2>
        <ul class="list-disc list-inside space-y-2 text-[1.25rem]">
          <li>Your name, role, and contact details</li>
          <li>Details about each service or form you want to digitise</li>
          <li>Any hard constraints we need to know before we arrive</li>
        </ul>
      </div>
      <div>
        <h2 class="font-bold text-[1.5rem] mb-2">Questions?</h2>
        <p>Contact the GovTech Barbados team:<br><span class="text-bb-mid-grey-00">[Confirm: GovTech contact name, email, and phone]</span></p>
      </div>
      ${GovBB.sbtn()}
    </div>`,

  'about-you': () => `
    <form novalidate>
      ${GovBB.bl()}${GovBB.cap()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-2">About you</h1>
      <p class="text-bb-mid-grey-00 mb-8">Tell us who you are and who else will be at the session.</p>
      <div class="space-y-8">
        ${GovBB.tf('sme-name','Your full name')}
        ${GovBB.tf('sme-role','Your job role')}
        ${GovBB.tlf('sme-tel','Your telephone number')}
        ${GovBB.ef('sme-email','Your email address')}
        ${GovBB.taf('other-attendees','Who else will be at the session? (optional)',{hint:'Name and role of anyone else joining — for example, the person who processes the applications day to day. Leave blank if unsure.',rows:3})}
      </div>
      ${GovBB.cbtn()}
    </form>`,

  'service-details': () => {
    const D = GovBB.D;
    const svcs = getServices();
    const isEditing = D._editingService !== null && D._editingService !== undefined;
    const editIdx = isEditing ? D._editingService : svcs.length;
    const heading = isEditing
      ? `Edit service ${editIdx + 1}`
      : svcs.length === 0 ? 'Tell us about the service' : `Add service ${svcs.length + 1}`;

    return `
    <form novalidate>
      ${GovBB.bl()}${GovBB.cap()}
      ${svcs.length > 0 ? `<p class="text-bb-mid-grey-00 text-[1rem] mb-2">You have added ${svcs.length} service${svcs.length>1?'s':''}.</p>` : ''}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">${heading}</h1>
      <div class="space-y-8">
        ${GovBB.tf('svc-name','Name of the service or form',{hint:'Use the name it is known by in your department.'})}
        ${GovBB.taf('svc-desc','In a sentence or two, what does this service do?',{hint:'For example: "People apply to join the Youth Empowerment Scheme. We assess eligibility and enrol successful applicants."',rows:3})}
        ${GovBB.tf('svc-section','Which section or team owns this service?')}
        ${GovBB.ef('svc-section-email','Section email address')}
        ${GovBB.tlf('svc-section-tel','Section telephone number')}
        ${GovBB.tf('svc-volume','Roughly how many applications do you receive?',{hint:'Monthly or yearly — an estimate is fine. For example: "About 200 per month."'})}
        ${GovBB.rg('svc-submission','How do people currently submit this form?',[
          {value:'paper-in-person',label:'Paper form — collected or dropped off in person'},
          {value:'paper-post',label:'Paper form — posted in'},
          {value:'email',label:'Emailed in'},
          {value:'mixed',label:'A mix of methods'},
          {value:'other',label:'Other'},
        ])}
        <div data-swn="svc-submission" data-swv="other" style="display:${D['svc-submission']==='other'?'':'none'}">
          ${GovBB.tf('svc-submission-other','Tell us how')}
        </div>

        <hr class="border-bb-grey-00"/>

        ${GovBB.tf('svc-approver','Who approves this form?',{hint:'The person or role that gives final sign-off on each application. For example: "Division Head" or "Chief Licensing Officer".'})}

        ${GovBB.rg('svc-processor-is-sme','Are you the person who processes applications when they come in?',[
          {value:'yes',label:'Yes, that is me'},
          {value:'no',label:'No, someone else does this'},
        ])}
        <div data-swn="svc-processor-is-sme" data-swv="no" style="display:${D['svc-processor-is-sme']==='no'?'':'none'}">
          <div class="bg-bb-blue-10 rounded-sm p-5 space-y-6">
            <p class="font-bold text-[1.1rem]">Tell us about the person who processes the applications</p>
            ${GovBB.tf('svc-processor-name','Their full name')}
            ${GovBB.tf('svc-processor-role','Their job role')}
            ${GovBB.ef('svc-processor-email','Their email address (optional)')}
            ${GovBB.tlf('svc-processor-tel','Their telephone number (optional)')}
          </div>
        </div>

        <hr class="border-bb-grey-00"/>

        ${GovBB.tf('svc-form-link','Link to or description of the current form',{hint:'Paste a link if the form is available online, or describe where we can find a copy. For example: a SharePoint link, a Google Drive link, or "Available on request from the section office".'})}

      </div>

      <div class="mt-10 flex flex-col sm:flex-row gap-4">
        <button type="button" onclick="saveAndContinue()" class="${GovBB.BTN}">
          ${isEditing ? 'Save changes' : 'Continue'}
        </button>
        ${!isEditing ? `<button type="button" onclick="saveAndAddAnother()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-colors duration-200 outline-none border-2 border-bb-teal-00 text-bb-teal-00 hover:bg-bb-teal-10 px-xm py-s rounded-sm leading-[1.7] focus-visible:ring-4 focus-visible:ring-bb-teal-100">
          + Add another service
        </button>` : ''}
      </div>
    </form>`;
  },

  'service-summary': () => {
    const svcs = getServices();
    if (svcs.length === 0) {
      return `
        ${GovBB.bl()}${GovBB.cap()}
        <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your services</h1>
        <p>No services added yet. <a href="#" onclick="nav('service-details');return false;" class="${GovBB.LNK}">Add a service</a>.</p>`;
    }
    const submissionLabel = v => ({'paper-in-person':'Paper — in person','paper-post':'Paper — post','email':'Email','mixed':'Mix of methods'}[v]||v||'—');
    const cards = svcs.map((s,i) => `
      <div class="service-card">
        <div class="service-card-header">
          <h2 class="font-bold text-[1.25rem]">Service ${i+1}: ${s.name||'Unnamed service'}</h2>
          <div class="flex gap-3">
            <a href="#" onclick="editService(${i});return false;" class="${GovBB.LNK} text-[1rem]">Change</a>
            ${svcs.length > 1 ? `<a href="#" onclick="removeService(${i});return false;" class="inline-flex outline-none underline-offset-2 underline hover:no-underline text-bb-red-00 text-[1rem]">Remove</a>` : ''}
          </div>
        </div>
        <dl class="space-y-1 text-[1rem]">
          <div class="flex gap-2"><dt class="font-semibold min-w-[140px]">Section:</dt><dd>${s.section||'—'}</dd></div>
          <div class="flex gap-2"><dt class="font-semibold min-w-[140px]">Volume:</dt><dd>${s.volume||'—'}</dd></div>
          <div class="flex gap-2"><dt class="font-semibold min-w-[140px]">Submitted by:</dt><dd>${submissionLabel(s.submissionMethod)}</dd></div>
          <div class="flex gap-2"><dt class="font-semibold min-w-[140px]">Approved by:</dt><dd>${s.approver||'—'}</dd></div>
          <div class="flex gap-2"><dt class="font-semibold min-w-[140px]">Processor:</dt><dd>${s.processorIsSme==='yes'?'You (the SME)':(s.processorName||'—')}</dd></div>
          <div class="flex gap-2"><dt class="font-semibold min-w-[140px]">Form link:</dt><dd class="break-all">${s.formLink||'—'}</dd></div>
        </dl>
      </div>`).join('');

    return `
      ${GovBB.bl()}${GovBB.cap()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Your services</h1>
      <p class="text-bb-mid-grey-00 mb-8">You have added ${svcs.length} service${svcs.length>1?'s':''}. Review them below, then continue.</p>
      <div class="space-y-4 mb-8">${cards}</div>
      <div class="mb-8">
        <a href="#" onclick="addFreshService();return false;" class="inline-flex items-center gap-2 border-2 border-bb-teal-00 text-bb-teal-00 hover:bg-bb-teal-10 px-xm py-s rounded-sm text-[1.25rem] font-medium">
          + Add another service
        </a>
      </div>
      ${GovBB.cbtn('Continue')}`;
  },

  'constraints': () => {
    const D = GovBB.D;
    return `
    <form novalidate>
      ${GovBB.bl()}${GovBB.cap()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-2">Anything we need to know before we arrive?</h1>
      <p class="text-bb-mid-grey-00 mb-8">Hard constraints only — things that are fixed and cannot change. We'll explore everything else together in the session.</p>
      <div class="space-y-8">
        ${GovBB.taf('legal-reqs','Are there any legal or regulatory requirements?',{hint:'For example: a specific Act the form must comply with, or data that must be collected by law. Leave blank if none.',rows:3})}
        ${GovBB.rg('has-deadline','Is there a fixed deadline for applications?',[{value:'yes',label:'Yes'},{value:'no',label:'No'}])}
        <div data-swn="has-deadline" data-swv="yes" style="display:${D['has-deadline']==='yes'?'':'none'}">
          ${GovBB.tf('deadline-detail','What is the deadline?',{hint:'For example: "Applications close 31 March each year."'})}
        </div>
        ${GovBB.rg('is-seasonal','Is this a seasonal or cohort-based service?',[{value:'yes',label:'Yes — it only runs at certain times of year or in cycles'},{value:'no',label:'No — it runs all year round'}])}

  },

  'what-well-cover': () => `
    <div>
      ${GovBB.bl()}${GovBB.cap()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">What we'll cover in the session</h1>
      <p class="text-bb-mid-grey-00 mb-8">You don't need to answer these now. This is a heads-up so you can bring the right people on the day.</p>
      <div class="space-y-3 mb-10">

        <div class="agenda-item"><h3>The form fields</h3><p>What information you collect today, what you wish you collected, and whether the ministry already holds any of it.</p></div>

        <div class="agenda-item"><h3>Supporting documents</h3><p>What applicants need to attach or bring, and what format those need to be in.</p></div>
        <div class="agenda-item"><h3>What happens after a decision</h3><p>What successful and unsuccessful applicants are told, and what they need to do next.</p></div>

      ${GovBB.cbtn('Continue to check your answers')}

      <p>Questions? Contact the GovTech Barbados team:<br><span class="text-bb-mid-grey-00">[Confirm: GovTech contact name, email, and phone]</span></p>
    </div>`,
};

/* ── Global helpers for service loop ── */
window.saveAndContinue = function() {
  const D = GovBB.D;
  const errs = validateServicePage();
  if (errs.length) { GovBB.showErrors(errs); return; }
  GovBB.clearErrors();
  saveCurrentService();
  clearServiceFields();
  nav('service-summary');
};

window.saveAndAddAnother = function() {
  const errs = validateServicePage();
  if (errs.length) { GovBB.showErrors(errs); return; }
  GovBB.clearErrors();
  saveCurrentService();
  clearServiceFields();
  GovBB.render(); // re-render service-details with fresh fields
};

window.editService = function(idx) {
  loadServiceForEdit(idx);
  nav('service-details');
};

window.removeService = function(idx) {
  removeService(idx);
};

window.addFreshService = function() {
  clearServiceFields();
  nav('service-details');
};

function validateServicePage() {
  const D = GovBB.D;
  const errs = [];
  if (!D['svc-name']||!D['svc-name'].trim()) errs.push({id:'svc-name',msg:'Enter the name of the service'});
  if (!D['svc-desc']||!D['svc-desc'].trim()) errs.push({id:'svc-desc',msg:'Enter a brief description of the service'});
  if (!D['svc-section']||!D['svc-section'].trim()) errs.push({id:'svc-section',msg:'Enter the section or team that owns this service'});
  if (!D['svc-section-email']||!D['svc-section-email'].trim()) errs.push({id:'svc-section-email',msg:'Enter the section email address'});
  if (!D['svc-volume']||!D['svc-volume'].trim()) errs.push({id:'svc-volume',msg:'Give a rough idea of your application volume'});
  if (!D['svc-approver']||!D['svc-approver'].trim()) errs.push({id:'svc-approver',msg:'Enter who approves this form'});
  if (!D['svc-processor-is-sme']) errs.push({id:'svc-processor-is-sme',msg:'Tell us who processes applications when they come in'});
  return errs;
}

/* ── Validation ── */
function validate(pageId) {
  const D = GovBB.D;
  const errs = [];
  if (pageId === 'about-you') {
    if (!D['sme-name']||!D['sme-name'].trim()) errs.push({id:'sme-name',msg:'Enter your full name'});
    if (!D['sme-role']||!D['sme-role'].trim()) errs.push({id:'sme-role',msg:'Enter your job role'});
    if (!D['sme-tel']||!D['sme-tel'].trim()) errs.push({id:'sme-tel',msg:'Enter your telephone number'});
    if (!D['sme-email']||!D['sme-email'].trim()) errs.push({id:'sme-email',msg:'Enter your email address'});
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(D['sme-email'])) errs.push({id:'sme-email',msg:'Enter a valid email address'});
  }
  if (pageId === 'service-summary') {
    if (getServices().length === 0) errs.push({id:'service-summary',msg:'Add at least one service before continuing'});
  }
  return errs;
}

/* ── Init ── */
GovBB.init({ formName: F, flow: FLOW, pages: PAGES, validate });
</script>
